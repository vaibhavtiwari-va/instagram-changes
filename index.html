<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <!-- Reels Section -->
    <section class="reels">
        <h2>Reels</h2>
        <div class="reel-container">
            <div class="reel">
                <video src="reel1.mp4" controls></video>
                <p>Reel by User4</p>
            </div>
            <div class="reel">
                <video src="reel2.mp4" controls></video>
                <p>Reel by User5</p>
            </div>
        </div>
    </section>
    <header>
        <nav>
            <div class="logo">Instagram</div>
            <div class="search-bar">
                <input type="text" placeholder="Search">
            </div>
            <div class="nav-icons">
                <a href="#">Home</a>
                <a href="#">Messages</a>
                <a href="#">Profile</a>
            </div>
          
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <div class="feed">
            <div class="post">
                <div class="post-header">
                    <span class="username">User1</span>
                </div>
                <div class="post-image">
                    <img src="https://images.unsplash.com/photo-1611262588024-d12430b98920?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Post Image">
                </div>
                <div class="post-actions">
                    <button>Like</button>
                    <button>Comment</button>
                </div>
            </div>
        </div>
        <aside class="sidebar">
            <div class="suggestions">
                <h3>Suggestions for you</h3>
                <ul>
                    <li>User2</li>
                    <li>User3</li>
                </ul>
            </div>
        </aside>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2023 Instagram Clone</p>
    </footer>
</body>
</html>
